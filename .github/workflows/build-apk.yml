name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Pro Mutual Fund APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build APK with Gradle
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ProMutualFund-Analytics.apk
          echo "APK successfully built and prepared!"

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProMutualFund-Analytics-APK
          path: ProMutualFund-Analytics.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.3
          name: "Pro Mutual Fund Analytics v1.0.3 (Rich Fund Detail Modal with Real-Time Risk Analytics & Verified Holdings)"
          body: "📱 Updated Native Android APK featuring: Dedicated Fund Detail Popup on all fund clicks, high-contrast 3-pillar return cards, 52W High/Low visual range slider, real-time calculated risk metrics (Volatility, Sharpe, Max Drawdown, Sortino, Beta), and verified top stock holdings."
          files: ProMutualFund-Analytics.apk
          draft: false
          prerelease: false
