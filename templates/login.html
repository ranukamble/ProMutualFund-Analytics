<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pro Mutual Fund Analytics</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/static/logo.png?v=3">
    <link rel="apple-touch-icon" href="/static/logo.png?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #0B0E14;
            color: #E2E8F0;
            overflow: hidden;
            position: relative;
        }
        /* Animated Background Blobs */
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            animation: float 10s infinite ease-in-out alternate;
        }
        .blob-1 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(59,130,246,0.8) 0%, rgba(59,130,246,0) 70%);
            top: -100px; left: -100px;
        }
        .blob-2 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(139,92,246,0.6) 0%, rgba(139,92,246,0) 70%);
            bottom: -150px; right: -100px;
            animation-delay: -5s;
        }
        .blob-3 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(14,165,233,0.5) 0%, rgba(14,165,233,0) 70%);
            top: 40%; left: 60%;
            animation-duration: 12s;
        }
        
        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-30px) scale(1.1); }
        }

        .login-container {
            background: rgba(16, 24, 39, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 10;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }
        .logo-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            position: relative;
            background: transparent;
            overflow: hidden;
        }
        .logo-icon img { width: 100%; height: 100%; object-fit: cover; }
        .logo-text h1 { font-size: 22px; font-weight: 800; color: #FFFFFF; letter-spacing: -0.5px; }
        .logo-text p { font-size: 12px; color: #94A3B8; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; margin-top: 4px; }
        
        .form-group { margin-bottom: 24px; position: relative; }
        .form-group label { 
            display: block; 
            font-size: 12px; 
            font-weight: 600; 
            color: #94A3B8; 
            margin-bottom: 8px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-control {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .form-control::placeholder { color: #475569; }
        .form-control:focus { 
            background: rgba(15, 23, 42, 0.8);
            border-color: #3B82F6; 
            box-shadow: 0 0 0 4px rgba(59,130,246,0.15); 
            transform: translateY(-2px);
        }
        
        .captcha-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }
        .captcha-box {
            background: linear-gradient(135deg, #1E293B, #0F172A);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px dashed rgba(255,255,255,0.2);
            font-size: 24px;
            font-weight: 800;
            color: #3B82F6;
            letter-spacing: 6px;
            user-select: none;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .refresh-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #94A3B8;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .refresh-btn:hover { background: rgba(255,255,255,0.1); color: #FFFFFF; transform: rotate(15deg); }
        .refresh-btn svg { width: 20px; height: 20px; }
        
        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        .login-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: all 0.5s;
        }
        .login-btn:hover::before { left: 100%; }
        .login-btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 10px 25px rgba(59,130,246,0.5); 
        }
        .login-btn:active { transform: translateY(0); }
        
        .footer-links {
            display: flex;
            justify-content: center;
        }
        .footer-links a {
            color: #94A3B8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.2s;
        }
        .footer-links a:hover { color: #FFFFFF; }
        
        #error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #FCA5A5;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            display: none;
            animation: shake 0.4s;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">
                <img src="/static/logo.png" alt="Logo">
            </div>
            <div class="logo-text">
                <h1>Pro Mutual Fund</h1>
                <p>Institutional Grade Portfolio Builder</p>
            </div>
        </div>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Partner ID</label>
                <input type="text" id="partnerId" class="form-control" placeholder="e.g. PRO2026" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
            </div>
            <div id="error-msg"></div>
            <div class="captcha-row">
                <div class="captcha-box" id="captchaText">32330</div>
                <button type="button" class="refresh-btn" onclick="generateCaptcha()" title="Refresh Captcha">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
                <input type="text" id="captchaInput" class="form-control" placeholder="Enter Captcha" required style="flex:1;">
            </div>
            <button type="submit" class="login-btn">Secure Login</button>
            <div class="footer-links">
                <a href="#" onclick="handleForgotPassword(event)">Forgot Your Password?</a>
            </div>
        </form>
    </div>
    <script>
        let currentCaptcha = "";
        function generateCaptcha() {
            currentCaptcha = Math.floor(10000 + Math.random() * 90000).toString();
            document.getElementById('captchaText').textContent = currentCaptcha;
            document.getElementById('captchaInput').value = "";
        }
        
        function handleForgotPassword(e) {
            e.preventDefault();
            const errorMsg = document.getElementById('error-msg');
            errorMsg.textContent = "Please contact the system administrator to reset your password. (Default: PRO2026 / admin)";
            errorMsg.style.display = 'block';
            errorMsg.style.color = '#60A5FA';
            errorMsg.style.background = 'rgba(59, 130, 246, 0.1)';
            errorMsg.style.borderColor = 'rgba(59, 130, 246, 0.3)';
            errorMsg.style.animation = 'none';
        }
        
        function handleLogin(e) {
            e.preventDefault();
            const partnerId = document.getElementById('partnerId').value;
            const password = document.getElementById('password').value;
            const input = document.getElementById('captchaInput').value;
            const errorMsg = document.getElementById('error-msg');
            
            errorMsg.style.display = 'none';

            if (partnerId !== "PRO2026" || password !== "admin") {
                errorMsg.textContent = "Invalid Partner ID or Password.";
                errorMsg.style.display = 'block';
                return;
            }

            if (input !== currentCaptcha) {
                errorMsg.textContent = "Incorrect Captcha. Please try again.";
                errorMsg.style.display = 'block';
                generateCaptcha();
                return;
            }
            window.location.href = "/dashboard";
        }
        
        generateCaptcha();
    </script>
</body>
</html>
